<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مغسلتي | My Laundry</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>🧺 مغسلتي</h1>
            <p>نظام إدارة الغسيل للسكن الطلابي</p>
        </header>

        <!-- واجهة تسجيل دخول الطالب -->
        <main id="login-screen">

            <h2>مرحباً بك في مغسلتي 🧺</h2>

            <p>أدخل رقمك الطلابي للدخول</p>

            <input
                type="text"
                id="student-number"
                placeholder="رقم الطالب"
                inputmode="numeric"
                dir="ltr"
            >

            <button id="login-button" type="button">
                دخول
            </button>

            <p id="message"></p>

        </main>

        <!-- لوحة الطالب -->
        <section id="student-dashboard" hidden>

            <h2>لوحة الطالب</h2>

            <p id="welcome"></p>

            <p>رصيد الغسلات المتبقي:</p>

            <h2 id="credits">0</h2>

            <h3>الغسالات</h3>

            <div id="washers"></div>

            <h3>المكاوي</h3>

            <div id="irons"></div>

            <button id="logout" type="button">
                تسجيل الخروج
            </button>

        </section>

        <!-- لوحة المدير -->
        <section id="admin-dashboard" hidden>

            <h2>لوحة إدارة مغسلتي 🛠️</h2>

            <h3>إضافة طالب جديد</h3>

            <input
                type="text"
                id="student-name"
                placeholder="اسم الطالب"
            >

            <input
                type="tel"
                id="student-phone"
                placeholder="+9677XXXXXXXX"
                dir="ltr"
            >

            <input
                type="number"
                id="student-credits"
                placeholder="عدد الغسلات"
                min="0"
            >

            <button id="add-student" type="button">
                إضافة الطالب
            </button>

            <hr>

            <h3>إدارة الأجهزة</h3>

            <div id="admin-washers"></div>

            <div id="admin-irons"></div>

            <hr>

            <h3>الطلاب المسجلون</h3>

            <div id="students-list"></div>

            <button id="admin-logout" type="button">
                تسجيل خروج المدير
            </button>

        </section>

    </div>

    <!-- ملف JavaScript الرئيسي -->
    <script src="script.js?v=3"></script>

</body>
</html>
